<!DOCTYPE html>
<html xml:lang="es">
  <head>
    <title>Saludador</title>
  </head>
  <body>
    <form id="saludar-form">
      <label>Ingrese su nombre:</label>
      <input type="text" id="nombreInput" placeholder="Tu nombre aqui">

      <label>Ingrese su edad:</label>
      <input type="number" id="edadInput" placeholder="Tu edad aqui">

      <label>Género:</label>
      <select id="generoSelect">
        <option value="Masculino">Masculino</option>
        <option value="Femenino">Femenino</option>
        <option value="Otro">Otro / Prefiero no decir</option>
      </select>

      <label>Idioma:</label>
      <select id="idiomaSelect">
        <option value="es">Español</option>
        <option value="en">English</option>
      </select>

      
      <button type="submit">Saludar</button>
    </form>
    <div id="resultado-div"></div>
  <script type="module" src="./src/presenter.js"></script>

  </body>
</html>
